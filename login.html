<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#7B3FF2">
    <title>Login - Five Crowns</title>
    <link rel="icon" type="image/png" href="favicon.ico">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        .auth-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
        }

        .auth-form {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .auth-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--gold);
            text-align: center;
            margin-bottom: 10px;
        }

        .auth-subtitle {
            font-size: 14px;
            color: var(--white);
            text-align: center;
            margin-bottom: 25px;
            opacity: 0.8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--white);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-input:focus {
            border-color: var(--gold);
            background: rgba(255, 255, 255, 0.15);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .error-text {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        .error-text.show {
            display: block;
        }

        .auth-toggle {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--white);
        }

        .auth-toggle a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-toggle a:hover {
            text-decoration: underline;
        }

        .forgot-password {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: var(--gold);
            text-decoration: none;
            font-size: 13px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading-spinner.show {
            display: block;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid var(--gold);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .social-signin {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .social-signin-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            margin-bottom: 15px;
        }

        .social-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-social {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-social:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-social:active {
            transform: translateY(0);
        }

        .btn-social:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-social img {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo and Title -->
        <div class="logo-section">
            <h1 class="game-title"><span class="crown-icon">👑</span> Five Crowns <span class="crown-icon">👑</span></h1>
            <p class="tagline">Five-Suited Rummy Card Game</p>
        </div>

        <!-- Auth Container -->
        <div class="auth-container">
            <!-- Login Form -->
            <div id="loginForm" class="auth-form">
                <h2 class="auth-title">Welcome Back</h2>
                <p class="auth-subtitle">Sign in to continue playing</p>

                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" class="form-input" placeholder="your@email.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" autocomplete="current-password">
                </div>

                <div class="forgot-password">
                    <a href="#" id="forgotPasswordLink">Forgot password?</a>
                </div>

                <p class="error-text" id="loginError"></p>

                <button class="btn btn-primary btn-large" id="loginBtn">Sign In</button>

                <div class="social-signin">
                    <p class="social-signin-text">Or continue with</p>
                    <div class="social-buttons">
                        <button class="btn-social" id="googleSignInBtn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                            </svg>
                            Sign in with Google
                        </button>
                        <button class="btn-social" id="appleSignInBtn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.09l-.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                            </svg>
                            Sign in with Apple
                        </button>
                    </div>
                </div>

                <div class="auth-toggle">
                    Don't have an account? <a href="#" id="showSignupLink">Sign up</a>
                </div>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="auth-form" style="display: none;">
                <h2 class="auth-title">Create Account</h2>
                <p class="auth-subtitle">Join the game</p>

                <div class="form-group">
                    <label class="form-label" for="signupFirstName">First Name</label>
                    <input type="text" id="signupFirstName" class="form-input" placeholder="Your name" autocomplete="given-name">
                </div>

                <div class="form-group">
                    <label class="form-label" for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" class="form-input" placeholder="your@email.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" class="form-input" placeholder="At least 6 characters" autocomplete="new-password">
                </div>

                <p class="error-text" id="signupError"></p>

                <button class="btn btn-primary btn-large" id="signupBtn">Create Account</button>

                <div class="social-signin">
                    <p class="social-signin-text">Or continue with</p>
                    <div class="social-buttons">
                        <button class="btn-social" id="googleSignUpBtn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                            </svg>
                            Sign up with Google
                        </button>
                        <button class="btn-social" id="appleSignUpBtn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.09l-.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                            </svg>
                            Sign up with Apple
                        </button>
                    </div>
                </div>

                <div class="auth-toggle">
                    Already have an account? <a href="#" id="showLoginLink">Sign in</a>
                </div>
            </div>

            <!-- Loading State -->
            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner"></div>
                <p style="color: var(--white); margin-top: 15px;">Loading...</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Firebase Config -->
    <script src="js/firebase-config.js"></script>

    <!-- Auth Service -->
    <script src="js/auth.js"></script>

    <!-- Login Page Logic -->
    <script>
        console.log('Login page loaded');

        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const loadingSpinner = document.getElementById('loadingSpinner');

        // Login elements
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');

        // Signup elements
        const signupFirstName = document.getElementById('signupFirstName');
        const signupEmail = document.getElementById('signupEmail');
        const signupPassword = document.getElementById('signupPassword');
        const signupBtn = document.getElementById('signupBtn');
        const signupError = document.getElementById('signupError');

        // Toggle links
        const showSignupLink = document.getElementById('showSignupLink');
        const showLoginLink = document.getElementById('showLoginLink');
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');

        // Check if user is already logged in
        auth.onAuthStateChanged((user) => {
            if (user) {
                console.log('User already logged in:', user.uid);
                // Redirect to home page
                window.location.href = 'index.html';
            } else {
                // Hide loading, show login form
                loadingSpinner.classList.remove('show');
                loginForm.style.display = 'block';
            }
        });

        // Show loading initially
        loadingSpinner.classList.add('show');
        loginForm.style.display = 'none';

        // Toggle between login and signup
        showSignupLink.addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.style.display = 'none';
            signupForm.style.display = 'block';
            loginError.classList.remove('show');
            signupError.classList.remove('show');
        });

        showLoginLink.addEventListener('click', (e) => {
            e.preventDefault();
            signupForm.style.display = 'none';
            loginForm.style.display = 'block';
            loginError.classList.remove('show');
            signupError.classList.remove('show');
        });

        // Login
        loginBtn.addEventListener('click', async () => {
            const email = loginEmail.value.trim();
            const password = loginPassword.value;

            // Validate
            if (!email || !password) {
                showError(loginError, 'Please fill in all fields');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';

            try {
                await signInUser(email, password);
                // Redirect handled by onAuthStateChanged
            } catch (error) {
                console.error('Login error:', error);
                const errorMessage = getAuthErrorMessage(error);

                // If email not verified, show resend option
                if (error.code === 'auth/email-not-verified') {
                    showError(loginError, errorMessage + ' <a href="#" id="resendVerificationLink" style="color: var(--gold); text-decoration: underline; cursor: pointer;">Resend verification email</a>');

                    // Add event listener for resend link
                    setTimeout(() => {
                        const resendLink = document.getElementById('resendVerificationLink');
                        if (resendLink) {
                            resendLink.addEventListener('click', async (e) => {
                                e.preventDefault();
                                try {
                                    // Sign in temporarily to send verification
                                    const userCred = await auth.signInWithEmailAndPassword(email, password);
                                    await userCred.user.sendEmailVerification();
                                    await auth.signOut();
                                    showError(loginError, '✅ Verification email sent! Please check your inbox.', false);
                                } catch (resendError) {
                                    showError(loginError, 'Failed to send verification email. Please try again.');
                                }
                            });
                        }
                    }, 100);
                } else {
                    showError(loginError, errorMessage);
                }

                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        // Signup
        signupBtn.addEventListener('click', async () => {
            const firstName = signupFirstName.value.trim();
            const email = signupEmail.value.trim();
            const password = signupPassword.value;

            // Validate
            if (!firstName || !email || !password) {
                showError(signupError, 'Please fill in all fields');
                return;
            }

            if (firstName.length < 2) {
                showError(signupError, 'First name must be at least 2 characters');
                return;
            }

            if (password.length < 6) {
                showError(signupError, 'Password must be at least 6 characters');
                return;
            }

            signupBtn.disabled = true;
            signupBtn.textContent = 'Creating account...';

            try {
                await signUpUser(email, password, firstName);
                // Show success message instead of auto-redirect
                await auth.signOut(); // Sign out the user
                showError(signupError, '✅ Account created! Please check your email to verify your address before signing in.', false);
                signupBtn.disabled = false;
                signupBtn.textContent = 'Create Account';

                // Clear form fields
                signupFirstName.value = '';
                signupEmail.value = '';
                signupPassword.value = '';

                // Optionally switch to login form after a delay
                setTimeout(() => {
                    signupForm.style.display = 'none';
                    loginForm.style.display = 'block';
                    loginEmail.value = email; // Pre-fill email
                    signupError.classList.remove('show');
                }, 3000);
            } catch (error) {
                console.error('Signup error:', error);
                showError(signupError, getAuthErrorMessage(error));
                signupBtn.disabled = false;
                signupBtn.textContent = 'Create Account';
            }
        });

        // Forgot password
        forgotPasswordLink.addEventListener('click', async (e) => {
            e.preventDefault();
            const email = loginEmail.value.trim();

            if (!email) {
                showError(loginError, 'Please enter your email address first');
                return;
            }

            try {
                await sendPasswordReset(email);
                showError(loginError, '✅ Password reset email sent! Check your inbox.', false);
            } catch (error) {
                showError(loginError, getAuthErrorMessage(error));
            }
        });

        // Google Sign-In (Login)
        const googleSignInBtn = document.getElementById('googleSignInBtn');
        googleSignInBtn.addEventListener('click', async () => {
            googleSignInBtn.disabled = true;
            googleSignInBtn.textContent = 'Signing in...';

            try {
                await signInWithGoogle();
                // Redirect handled by onAuthStateChanged
            } catch (error) {
                console.error('Google sign-in error:', error);
                showError(loginError, getAuthErrorMessage(error));
                googleSignInBtn.disabled = false;
                googleSignInBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg> Sign in with Google';
            }
        });

        // Apple Sign-In (Login)
        const appleSignInBtn = document.getElementById('appleSignInBtn');
        appleSignInBtn.addEventListener('click', async () => {
            appleSignInBtn.disabled = true;
            appleSignInBtn.textContent = 'Signing in...';

            try {
                await signInWithApple();
                // Redirect handled by onAuthStateChanged
            } catch (error) {
                console.error('Apple sign-in error:', error);
                showError(loginError, getAuthErrorMessage(error));
                appleSignInBtn.disabled = false;
                appleSignInBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.09l-.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg> Sign in with Apple';
            }
        });

        // Google Sign-Up
        const googleSignUpBtn = document.getElementById('googleSignUpBtn');
        googleSignUpBtn.addEventListener('click', async () => {
            googleSignUpBtn.disabled = true;
            googleSignUpBtn.textContent = 'Signing up...';

            try {
                await signInWithGoogle();
                // Redirect handled by onAuthStateChanged
            } catch (error) {
                console.error('Google sign-up error:', error);
                showError(signupError, getAuthErrorMessage(error));
                googleSignUpBtn.disabled = false;
                googleSignUpBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg> Sign up with Google';
            }
        });

        // Apple Sign-Up
        const appleSignUpBtn = document.getElementById('appleSignUpBtn');
        appleSignUpBtn.addEventListener('click', async () => {
            appleSignUpBtn.disabled = true;
            appleSignUpBtn.textContent = 'Signing up...';

            try {
                await signInWithApple();
                // Redirect handled by onAuthStateChanged
            } catch (error) {
                console.error('Apple sign-up error:', error);
                showError(signupError, getAuthErrorMessage(error));
                appleSignUpBtn.disabled = false;
                appleSignUpBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.09l-.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg> Sign up with Apple';
            }
        });

        // Enter key handlers
        loginPassword.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        signupPassword.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') signupBtn.click();
        });

        // Helper function to show errors
        function showError(element, message, isError = true) {
            element.innerHTML = message; // Changed from textContent to innerHTML to support links
            element.classList.add('show');
            if (!isError) {
                element.style.color = '#4ade80';
            } else {
                element.style.color = '#ff6b6b';
            }
        }
    </script>
</body>
</html>
