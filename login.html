<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#140C1E">
    <title>Login - Five Crowns</title>
    <link rel="icon" type="image/png" href="favicon.ico">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css?v=nav95">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Login theme (Royal Velvet) - loaded last so it overrides the inline styles -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css?v=2">
</head>
<body>
    <div class="container">
        <!-- The brand header now lives INSIDE the card (js/login-ui.js), so it is
             never duplicated between this page and the app's login modal. -->
        <div id="loginMount"></div>
    </div>

    <!-- Firebase SDKs (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Firebase Config -->
    <script src="js/firebase-config.js"></script>

    <!-- Auth Service -->
    <script src="js/auth.js"></script>

    <!-- Login Page Logic -->
    <script src="js/login-ui.js"></script>

    <!-- Mount the shared login UI in page mode (success redirects to the app) -->
    <script>
        (function () {
            window.FiveCrownsLogin.mount('loginMount', {});
        })();
    </script>
</body>
</html>
