<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Playing - Five Crowns</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css?v=20250118h">
    <link rel="stylesheet" href="css/game.css?v=20250118l">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="game-page">
    <!-- Game Board Container -->
    <div class="game-container">

        <!-- Top Bar: Game Info -->
        <div class="game-header">
            <div class="round-info">
                <span class="round-number">Round <strong id="roundNumber">1</strong></span>
                <span class="wild-indicator">
                    <span id="wildCard">3s</span> are wild ⭐
                </span>
            </div>
            <div class="player-score">
                Score: <strong id="yourScore">0</strong>
            </div>
            <button class="menu-btn" id="menuBtn">⋮</button>
        </div>

        <!-- Main Game Table -->
        <div class="game-table">

            <!-- Center Area: Deck and Discard -->
            <div class="table-center">
                <div class="center-cards">
                    <!-- Deck -->
                    <div class="deck-area" id="deckArea">
                        <div class="card-stack">
                            <div class="card-back stack-card"></div>
                            <div class="card-back stack-card"></div>
                            <div class="card-back stack-card"></div>
                            <div class="card-back stack-card"></div>
                            <div class="card-back stack-card"></div>
                            <div class="card-back stack-card"></div>
                            <div class="card-back stack-card"></div>
                            <div class="card-back stack-card"></div>
                        </div>
                        <div class="deck-count" id="deckCount">0</div>
                    </div>

                    <!-- Discard Pile -->
                    <div class="discard-area" id="discardArea">
                        <div class="discard-pile" id="discardPile">
                            <div class="card">
                                <div class="card-content">
                                    <span class="card-rank">9</span>
                                    <span class="card-suit hearts">♥</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Turn Instruction -->
                <div class="turn-instruction" id="turnInstruction">
                    <p>Tap deck or discard to draw</p>
                </div>
            </div>

        </div>

        <!-- Bottom: Your Hand -->
        <div class="player-hand-section">
            <div class="hand-header">
                <span class="hand-title">Your Hand</span>
                <span class="hand-count">(<span id="handCount">0</span> cards)</span>
            </div>

            <!-- Scrollable Card Container -->
            <div class="hand-cards-container" id="handCardsContainer">
                <div class="hand-cards" id="handCards">
                    <!-- Cards will be dynamically added here by JavaScript -->
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="hand-actions">
                <button class="btn btn-secondary" id="discardBtn">
                    Discard Selected
                </button>
                <button class="btn btn-primary" id="goOutBtn">
                    👑 Go Out
                </button>
            </div>
        </div>

    </div>

    <!-- Game Menu Modal -->
    <div class="modal" id="gameMenuModal">
        <div class="modal-content small">
            <div class="modal-header">
                <h2>Game Menu</h2>
                <button class="close-btn" id="closeMenuBtn">&times;</button>
            </div>
            <div class="modal-body">
                <button class="menu-option-btn" id="viewScoresBtn">
                    📊 View Scores
                </button>
                <button class="menu-option-btn" id="viewRulesBtn">
                    📖 Game Rules
                </button>
                <button class="menu-option-btn danger" id="leaveGameBtn">
                    🚪 Leave Game
                </button>
            </div>
        </div>
    </div>

    <!-- Round End Score Modal -->
    <div class="modal" id="roundEndModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="roundEndTitle">🏁 Round Complete!</h2>
            </div>
            <div class="modal-body">
                <div id="roundEndContent" style="margin-bottom: 20px;">
                    <!-- Score table will be inserted here -->
                </div>
                <div id="roundEndMessage" style="text-align: center; color: var(--accent); font-size: 18px; font-weight: 600; margin: 20px 0; white-space: nowrap;">
                    <!-- Next round message will be inserted here -->
                </div>
                <button class="btn btn-primary" id="continueRoundBtn" style="width: 100%; display: none;">
                    Continue to Next Round
                </button>
                <p id="waitingMessage" style="text-align: center; color: var(--text-muted); font-size: 14px; margin-top: 10px; display: none;">
                    Waiting to continue...
                </p>
            </div>
        </div>
    </div>

    <!-- Game End Modal -->
    <div class="modal" id="gameEndModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🎉 Game Over!</h2>
            </div>
            <div class="modal-body">
                <div id="winnerMessage" style="text-align: center; font-size: 24px; font-weight: 700; color: var(--accent); margin-bottom: 30px;">
                    <!-- Winner announcement will be inserted here -->
                </div>
                <div id="finalScores" style="margin-bottom: 20px;">
                    <!-- Final scores table will be inserted here -->
                </div>
                <button class="btn btn-primary" id="returnHomeBtn" style="width: 100%;">
                    Return to Home
                </button>
            </div>
        </div>
    </div>

    <!-- Error Modal -->
    <div class="modal" id="errorModal">
        <div class="modal-content small">
            <div class="modal-header">
                <h2>⚠️ Error</h2>
                <button class="close-btn" id="closeErrorBtn">&times;</button>
            </div>
            <div class="modal-body">
                <p id="errorMessage" style="text-align: center; color: var(--white); font-size: 16px; margin: 20px 0;"></p>
                <button class="btn btn-primary" id="errorOkBtn" style="width: 100%;">OK</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- Firebase Config -->
    <script src="js/firebase-config.js"></script>

    <!-- Card Hand Manager -->
    <script src="js/cardHand.js?v=4"></script>

    <!-- Deck/Discard Manager -->
    <script src="js/deckDiscard.js?v=4"></script>

    <!-- Game Logic -->
    <script src="js/game.js?v=4"></script>
</body>
</html>
