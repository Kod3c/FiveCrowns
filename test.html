<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .log {
            margin: 10px 0;
            padding: 10px;
            background: #2a2a2a;
            border-left: 3px solid #00ff00;
        }
        .error {
            border-left-color: #ff0000;
            color: #ff0000;
        }
        .success {
            border-left-color: #00ff00;
            color: #00ff00;
        }
        button {
            background: #7B3FF2;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin: 5px;
        }
        button:hover {
            background: #5B2FB2;
        }
    </style>
</head>
<body>
    <h1>Firebase Connection Test</h1>
    <div id="output"></div>
    <button onclick="testWrite()">Test Write to Database</button>
    <button onclick="testRead()">Test Read from Database</button>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const output = document.getElementById('output');

        function log(message, type = 'log') {
            const div = document.createElement('div');
            div.className = 'log ' + type;
            div.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            output.appendChild(div);
            console.log(message);
        }

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCI2wnbwb7gRsrQ-DxF9Im8QJsQvAt4FuA",
            authDomain: "fivecrowns-9be7c.firebaseapp.com",
            databaseURL: "https://fivecrowns-9be7c-default-rtdb.firebaseio.com",
            projectId: "fivecrowns-9be7c",
            storageBucket: "fivecrowns-9be7c.firebasestorage.app",
            messagingSenderId: "621405515096",
            appId: "1:621405515096:web:e7546fcb4d967d0c87092d",
            measurementId: "G-GKD2R7KYB1"
        };

        log('Initializing Firebase...');

        try {
            const app = firebase.initializeApp(firebaseConfig);
            log('✅ Firebase app initialized', 'success');

            const database = firebase.database();
            log('✅ Firebase database initialized', 'success');

            window.database = database;
        } catch (error) {
            log('❌ Firebase initialization error: ' + error.message, 'error');
        }

        function testWrite() {
            log('Testing write to database...');
            const testRef = database.ref('test/connection');

            testRef.set({
                message: 'Hello from Five Crowns!',
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                random: Math.random()
            })
            .then(() => {
                log('✅ WRITE SUCCESS! Database is working!', 'success');
            })
            .catch((error) => {
                log('❌ WRITE ERROR: ' + error.message, 'error');
                log('Error code: ' + error.code, 'error');
                if (error.code === 'PERMISSION_DENIED') {
                    log('⚠️ PERMISSION DENIED - You need to update Firebase Database Rules!', 'error');
                    log('Go to Firebase Console > Realtime Database > Rules', 'error');
                }
            });
        }

        function testRead() {
            log('Testing read from database...');
            const testRef = database.ref('test/connection');

            testRef.once('value')
                .then((snapshot) => {
                    if (snapshot.exists()) {
                        log('✅ READ SUCCESS! Data: ' + JSON.stringify(snapshot.val()), 'success');
                    } else {
                        log('⚠️ No data found (write something first)', 'log');
                    }
                })
                .catch((error) => {
                    log('❌ READ ERROR: ' + error.message, 'error');
                    if (error.code === 'PERMISSION_DENIED') {
                        log('⚠️ PERMISSION DENIED - You need to update Firebase Database Rules!', 'error');
                    }
                });
        }

        // Auto-run tests on load
        setTimeout(() => {
            log('Running automatic connection test...');
            testWrite();
        }, 1000);
    </script>
</body>
</html>
